<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mini-claude-code</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='5' y='3' width='6' height='10' fill='%23e5142b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/inspector.css">
</head>
<body>
  <div class="app" id="app">
    <!-- 左：会话 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span class="brand-cursor"></span></span>
        <span class="brand-name">mini-claude-code</span>
      </div>
      <button class="btn btn-solid new-session" id="new-session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        新建会话
      </button>
      <nav class="session-list" id="session-list" aria-label="会话列表"></nav>
      <dl class="env" id="env"></dl>
    </aside>

    <!-- 中：对话 -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-narrow" id="toggle-sidebar" aria-label="会话列表">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 class="session-title" id="session-title">新会话</h1>
        <div class="topbar-tools">
          <div class="meter" id="context-meter" title="上下文占用">
            <span class="meter-label">上下文</span>
            <span class="meter-track"><span class="meter-fill" id="context-fill"></span></span>
            <span class="meter-value" id="context-value">0%</span>
          </div>
          <div class="segmented" id="mode-switch" role="group" aria-label="权限模式">
            <button data-mode="ask" title="每条 Shell 命令执行前都询问">逐次确认</button>
            <button data-mode="auto" title="除黑名单外自动放行">自动放行</button>
          </div>
          <span class="conn" id="conn" title="与后端的连接"><i></i><span>连接中</span></span>
          <button class="icon-btn only-medium" id="toggle-inspector" aria-label="运行面板">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/></svg>
          </button>
        </div>
      </header>

      <section class="conversation" id="conversation" aria-live="polite">
        <div class="trace" id="trace"></div>
      </section>

      <footer class="composer">
        <div class="slash-menu" id="slash-menu" hidden></div>
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="描述你要完成的任务，输入 / 查看命令"></textarea>
          <button class="round-btn" id="send" aria-label="发送" title="发送（Enter）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
          </button>
          <button class="round-btn stop" id="stop" aria-label="停止" title="停止本轮执行" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
          </button>
        </div>
      </footer>
    </main>

    <!-- 右：运行面板 -->
    <aside class="inspector" id="inspector">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="tab-body" id="tab-body"></div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
